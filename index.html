<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

   <div class="slider">

  <div class="slides">

    <div class="slide">
        <img src="https://picsum.photos/id/1015/800/500" alt="Mountain">
        <div class="caption">
            <h2>Beautiful Mountains</h2>
            <p>Explore the beauty of nature</p>
        </div>
    </div>

    <div class="slide">
        <img src="https://picsum.photos/id/1016/800/500" alt="Nature">
        <div class="caption">
            <h2>Peaceful Nature</h2>
            <p>Enjoy every moment</p>
        </div>
    </div>

    <div class="slide">
        <img src="https://picsum.photos/id/1018/800/500" alt="Landscape">
        <div class="caption">
            <h2>Amazing Landscape</h2>
            <p>Discover new places</p>
        </div>
    </div>

    <div class="slide">
        <img src="https://picsum.photos/id/1020/800/500" alt="Forest">
        <div class="caption">
            <h2>Beautiful Forest</h2>
            <p>Adventure is waiting</p>
        </div>
    </div>

</div>

    <button class="prev">❮</button>
    <button class="next">❯</button>

    <div class="dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>

</div>
      <script src="script.js"></script>
</body>
</html>
